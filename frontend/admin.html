<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel | Joeder Blanca</title>

  <link rel="icon" href="favicon.ico" sizes="48x48" />
  <link rel="icon" type="image/png" sizes="96x96" href="assets/img/favicon-96x96.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/apple-touch-icon.png" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
  <link href="assets/css/admin.css" rel="stylesheet">

  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
</head>
<body>

  <!-- Login -->
  <div id="login-panel" class="login-wrapper hidden">
    <div class="login-card">
      <div class="text-center mb-5">
        <i data-lucide="command" style="width: 56px; height: 56px; color: var(--primary);"></i>
        <h3 class="mt-4" style="font-weight: 700; letter-spacing: -0.02em;">Painel de Controle</h3>
        <p class="text-secondary mt-2" style="font-size: 15px;">Gerencie todo o conteúdo do seu site</p>
      </div>

      <div id="login-error" class="alert alert-danger hidden" role="alert" style="font-size: 14px; border-radius: 8px;"></div>

      <form id="login-form" novalidate>
        <div class="mb-4">
          <label class="form-label" for="email">Endereço de e-mail</label>
          <input type="email" class="form-control" id="email" autocomplete="username" required placeholder="seu@email.com">
        </div>
        <div class="mb-5">
          <label class="form-label" for="password">Senha de acesso</label>
          <div class="input-group">
            <input type="password" class="form-control" id="password" autocomplete="current-password" required placeholder="••••••••">
            <button class="btn btn-outline-secondary" type="button" id="toggle-password" aria-label="Mostrar senha"
              style="border-color: var(--border); border-radius: 0 8px 8px 0;">
              <i class="bi bi-eye" id="toggle-password-icon"></i>
            </button>
          </div>
        </div>
        <button type="submit" id="login-btn" class="btn-saas w-100" style="padding: 12px; font-size: 16px;">Entrar no sistema</button>
        <div class="text-center mt-4 pt-2">
          <a href="index.html" class="text-secondary text-decoration-none" style="font-size: 14px; font-weight: 500;">&larr; Voltar ao site principal</a>
        </div>
      </form>
    </div>
  </div>

  <!-- App -->
  <div id="app-panel" class="app-wrapper hidden">
    <div class="mobile-topbar">
      <div class="sidebar-brand">
        <i data-lucide="command" style="color: var(--primary)"></i> Workspace
      </div>
      <button type="button" class="icon-btn" id="sidebar-toggle" aria-label="Abrir menu">
        <i data-lucide="menu" style="width: 20px; height: 20px;"></i>
      </button>
    </div>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <aside class="sidebar">
      <div class="sidebar-brand">
        <i data-lucide="command" style="color: var(--primary)"></i> Workspace
      </div>
      <nav id="sidebar-nav"></nav>
      <div class="sidebar-footer">
        <ul class="sidebar-nav">
          <li><a class="nav-item" href="index.html" target="_blank" rel="noopener"><i data-lucide="external-link"></i> Ver site</a></li>
          <li><a class="nav-item danger" href="#" id="btn-logout"><i data-lucide="log-out"></i> Encerrar sessão</a></li>
        </ul>
      </div>
    </aside>

    <main class="main-content" id="view"></main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/admin.js"></script>
</body>
</html>
