    <script>
      const container = document.getElementById("posts-container");
      const summaryContainer = document.getElementById("summary-container");

      fetch("https://pyibnkqafmoeypjpbhwr.supabase.co/rest/v1/posts?select=*&order=id.desc", {
        headers: {
          "apikey": "sb_publishable_cwUyRtxb_cRsQTp3x-Lm9A_JavaOLts",
          "Authorization": "Bearer sb_publishable_cwUyRtxb_cRsQTp3x-Lm9A_JavaOLts"
        }
      })
        .then((response) => response.json())
        .then((posts) => {
          const urlParams = new URLSearchParams(window.location.search);
          const postParam = urlParams.get("post");

          let filteredPosts = postParam
            ? posts.filter((p) => p.id === parseInt(postParam))
            : posts;

          if (postParam && filteredPosts.length === 0) {
            filteredPosts = posts;
          }

          // --- Cria posts ---
          filteredPosts.forEach((postData, index) => {
            const galleryHtml = postData.images
              .map(
                (img, imgIndex) => `
              <div class="col-md-4">
                <img src="${img.url}" alt="gallery-${index}-${imgIndex}" class="img-fluid rounded gallery-img"
                  style="width: 100%; max-height: 250px; object-fit: cover; object-position: top;"/>
              </div>
            `
              )
              .join("");

            const postHtml = `
          <div class="card shadow mb-4">
            <div class="card-body">
              <div class="service-hero p-3">
                <img src="${postData.imgHeader}" alt="post${index}" class="img-fluid rounded" style="width: 100%; object-fit: cover; object-position: top;"/>
                <div class="service-badge">
                  <span>${postData.tag}</span>
                </div>
              </div>
              <div class="service-content">
                <div class="service-header">
                  <h2>${postData.title}</h2>
                  <p class="service-intro" style="text-align: justify; white-space: pre-line;">
                    ${postData.content}
                  </p>
                </div>
                <div class="service-gallery" data-aos="fade-up" data-aos-delay="100">
                  <h4>Galeria</h4>
                  <div class="row gy-3">
                    ${galleryHtml}
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;

            container.innerHTML += postHtml;
          });

          // --- Cria sumário de posts ---
          const summaryPostsHtml = posts
                                        .map((post) => {
                                          // verifica se o parâmetro da URL corresponde ao id do post
                                          const isActive = postParam && parseInt(postParam) === post.id ? "active" : "";
                                          return `
                                            <a href="service-details.html?post=${post.id}" class="menu-item ${isActive}">
                                              <i class="bi bi-arrow-right"></i>
                                              <span>${post.title}</span>
                                            </a>
                                          `;
                                        })
                                        .join("");

                  const summary = `
                      <div class="service-menu">
                        <h4>Posts</h4>
                        <div class="menu-list">
                          ${summaryPostsHtml}
                        </div>
                      </div>`;

          summaryContainer.innerHTML += summary;

          // --- Modal de galeria ---
          const modal = document.getElementById("imageModal");
          const modalImg = document.getElementById("modalImg");
          const closeModal = document.querySelector(".close-modal");

          document.querySelectorAll(".gallery-img").forEach((img) => {
            img.addEventListener("click", () => {
              modal.style.display = "block";
              modalImg.src = img.src;
            });
          });

          closeModal.addEventListener("click", () => {
            modal.style.display = "none";
          });

          modal.addEventListener("click", (e) => {
            if (e.target === modal) modal.style.display = "none";
          });
        })
        .catch((error) => {
          console.error("Erro ao carregar o arquivo posts.json:", error);
          container.innerHTML = "<p>Erro ao carregar posts.</p>";
        });
    </script>
